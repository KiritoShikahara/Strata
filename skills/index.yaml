  category: external
  path: external/anthropics/skill-creator
  description: Create new skills, modify and improve existing skills, and measure skill performance. Use when users want to create a skill from scratch, edit, or optimize an existing skill, run evals to
    test a skill, benchmark skill performance with variance analysis, or optimize a skill's description for better triggering accuracy.
  triggers: []
  risk_level: external
  source: external
- name: ponytail
  category: external
  path: external/DietrichGebert/ponytail
  description: 'Forces the laziest solution that actually works, simplest, shortest, most minimal. Channels a senior dev who has seen everything: question whether the task needs to exist at all (YAGNI),
    reach for the standard library before custom code, native platform features before dependencies, one line before fifty. Supports intensity levels: lite, full (default), ultra. Use on ANY coding task:
    writing, adding, refactoring, fixing, reviewing, or designing code, and choosing libraries or dependencies. Also use whenever the user says "ponytail", "be lazy", "lazy mode", "simplest solution", "minimal
    solution", "yagni", "do less", or "shortest path", or complains about over-engineering, bloat, boilerplate, or unnecessary dependencies. Do NOT use for non-coding requests (general knowledge, prose,
    translation, summaries, recipes).'
  triggers: []
  risk_level: external
  source: external
- name: ponytail-audit
  category: external
  path: external/DietrichGebert/ponytail-audit
  description: 'Whole-repo audit for over-engineering. Like ponytail-review, but scans the entire codebase instead of a diff: a ranked list of what to delete, simplify, or replace with stdlib/native equivalents.
    Use when the user says "audit this codebase", "audit for over-engineering", "what can I delete from this repo", "find bloat", "ponytail-audit", or "/ponytail-audit". One-shot report, does not apply
    fixes.'
  triggers: []
  risk_level: external
  source: external
- name: ponytail-debt
  category: external
  path: external/DietrichGebert/ponytail-debt
  description: Harvest every `ponytail:` comment in the codebase into a debt ledger, so the deliberate shortcuts and deferrals ponytail leaves behind get tracked instead of rotting into "later means never".
    Use when the user says "ponytail debt", "/ponytail-debt", "what did ponytail defer", "list the shortcuts", "ponytail ledger", or "what did we mark to do later". One-shot report, changes nothing.
  triggers: []
  risk_level: external
  source: external
- name: ponytail-review
  category: external
  path: external/DietrichGebert/ponytail-review
  description: 'Code review focused exclusively on over-engineering. Finds what to delete: reinvented standard library, unneeded dependencies, speculative abstractions, dead flexibility. One line per finding:
    location, what to cut, what replaces it. Use when the user says "review for over-engineering", "what can we delete", "is this over-engineered", "simplify review", or invokes /ponytail-review. Complements
    correctness-focused review, this one only hunts complexity.'
  triggers: []
  risk_level: external
  source: external
